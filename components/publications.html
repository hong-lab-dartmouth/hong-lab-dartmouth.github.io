<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Lab | Publications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="logo-mark" aria-label="Hong Lab home">
        <img src="../assets/logo.png" alt="Hong Lab" />
      </a>

      <nav class="main-nav">
          <ul>
              <li><a href="../index.html#research">What We Do</a></li>
              <li><a href="people.html">People</a></li>
              <li><a href="publications.html">Publications</a></li>
              <li><a href="../index.html#contact">Contact</a></li>
          </ul>
      </nav>

    </div>
  </header>

  <!-- Page content -->
  <main class="page-content">
    <section class="publications-section" id="publications-section">
      <h1 class="page-title">Publications</h1>
    </section>
  </main>

  <script>
    async function loadPublications() {
      const res = await fetch("./publications.json");

      if (!res.ok) {
        throw new Error("Could not load publications.json");
      }

      const data = await res.json();
      const container = document.getElementById("publications-section");

      data.years.forEach(group => {
        const yearDiv = document.createElement("div");
        yearDiv.className = "pub-year";

        const yearTitle = document.createElement("h2");
        yearTitle.className = "pub-year-title";
        yearTitle.textContent = group.year;
        yearDiv.appendChild(yearTitle);

        group.items.forEach(pub => {
          const article = document.createElement("article");
          article.className = "pub-item";

          const title = document.createElement("h3");
          title.className = "pub-title";
          title.textContent = pub.title;

          const authors = document.createElement("p");
          authors.className = "pub-authors";
          authors.textContent = pub.authors;

          const venue = document.createElement("p");
          venue.className = "pub-venue";
          venue.textContent = pub.venue;

          article.appendChild(title);
          article.appendChild(authors);
          article.appendChild(venue);

          if (pub.links && pub.links.length > 0) {
            const linksDiv = document.createElement("div");
            linksDiv.className = "pub-links";

            pub.links.forEach(link => {
              const a = document.createElement("a");
              a.href = link.url;
              a.className = "pub-link";
              a.textContent = link.label;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              linksDiv.appendChild(a);
            });

            article.appendChild(linksDiv);
          }

          yearDiv.appendChild(article);
        });

        container.appendChild(yearDiv);
      });
    }

    loadPublications().catch(err => {
      console.error("Failed to load publications:", err);
    });
  </script>

</body>
</html>
